
name: Test Automatic Schedule

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Verify automatic execution
        run: |
          echo "GitHub scheduler test"
          echo "Trigger: ${{ github.event_name }}"
          echo "Current UTC time:"
          date -u
          echo "SUCCESS"
